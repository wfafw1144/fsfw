name: Build MemCLI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build with cl.exe
        shell: cmd
        run: |
          cl src\main.cpp /EHsc /O2 /W3 /MT /Fe:memcli.exe psapi.lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memcli-windows-x64
          path: memcli.exe
          retention-days: 30
